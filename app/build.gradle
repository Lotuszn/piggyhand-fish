plugins {
    id 'com.android.application'
}

android {
    namespace 'com.piggyhand.fish'
    compileSdk 34

    defaultConfig {
        applicationId "com.piggyhand.fish"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "1.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Xposed API（编译期引入，运行由 LSPosed 提供）
    // 若 https://api.xposed.info/ 仓库失效：手动下载 XposedBridgeApi-82.jar 放到
    // app/libs/ 下，并把这行改为 compileOnly files('libs/XposedBridgeApi-82.jar')
    compileOnly 'de.robv.android.xposed:api:82'
}
